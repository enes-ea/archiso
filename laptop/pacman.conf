#
# /etc/pacman.conf for the laptop profile.
# Intel Core i5-1135G7, x86-64-v3 CachyOS repositories.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
PrettyProgressBar
CheckSpace
VerbosePkgLists
ParallelDownloads = 24
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
